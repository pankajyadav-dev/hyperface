services:
  db:
    image: postgres:16-alpine
    container_name: hyperface_rooms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyperface
      POSTGRES_PASSWORD: hyperface
      POSTGRES_DB: hyperface_rooms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperface -d hyperface_rooms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hyperface_rooms_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hyperface:hyperface@db:5432/hyperface_rooms
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
