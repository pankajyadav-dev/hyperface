services:
  db:
    image: postgres:16-alpine
    container_name: hyperface_rooms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyperface
      POSTGRES_PASSWORD: hyperface
      POSTGRES_DB: hyperface_rooms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperface -d hyperface_rooms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: hyperface_rooms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hyperface:hyperface@db:5432/hyperface_rooms
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: hyperface_rooms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
